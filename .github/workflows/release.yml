# A tag vX.Y.Z (or a run naming one, tagged here) publishes a signed release.
# Builds hold no secrets and a read-only token: a dependency's build script
# can steal nothing. Only `publish`, in the `release` Environment (Settings
# › Environments: required reviewers; tags v* protected), signs and uploads.
# Its secrets: TAURI_SIGNING_PRIVATE_KEY(_PASSWORD), ANDROID_KEYSTORE
# (base64), ANDROID_KEYSTORE_PASSWORD. Apple signs while building, so its
# secrets, once they exist, reach the macOS and TestFlight builds: APPLE_
# CERTIFICATE (base64 .p12), _CERTIFICATE_PASSWORD, _SIGNING_IDENTITY, _ID,
# _PASSWORD, _TEAM_ID; APPLE_API_KEY, _API_ISSUER, _API_KEY_P8.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, vX.Y.Z
        required: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # Push servers phones register with: the ids `irch --serve` prints beside
  # fcm.json (Settings › Secrets and variables › Actions › Variables).
  IRCH_PUSH: ${{ vars.IRCH_PUSH }}

jobs:
  # Nothing is built, signed or published unless irch's own tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --locked -p irch-core -p irch-math
          --features irch-core/voice
      - run: node --test app/tests/*.test.mjs

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin, arch: aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, arch: x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev
          libjavascriptcoregtk-4.1-dev librsvg2-dev libasound2-dev
      - run: cargo install tauri-cli --version 2.12.4 --locked
      # Only irch's own version: else it reaches sed, or updates forever.
      - name: The tag is the version
        shell: bash
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "version = \"${TAG#v}\"" Cargo.toml
          v='"version": "'${TAG#v}'"'
          sed -i.bak "s/\"version\": \"[^\"]*\"/$v/" app/tauri.conf.json
      - name: Apple's notarization, once its secrets exist (else ad hoc)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] || echo "$v=${!v}" >> "$GITHUB_ENV"
          done
      # Unsigned for updates: `publish` signs every file, holding the key.
      - name: The app
        working-directory: app
        shell: bash
        run: cargo tauri build --target ${{ matrix.target }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # Static on Linux, for any distribution; it updates itself.
      - name: The terminal client and storage node, beside the app
        shell: bash
        env:
          IRCH_RELEASE: "1"
        run: |
          t=${{ matrix.target }}
          if [ "$RUNNER_OS" = Linux ]; then
            t=${t/gnu/musl}
            sudo apt-get install -y musl-tools && rustup target add $t
            export "CC_${t//-/_}=musl-gcc"
          fi
          cargo build --release --locked -p irch --target $t
          x=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          mkdir -p out && cp target/$t/release/irch$x out/irch-$t$x
      - name: Gather what ships
        shell: bash
        run: |
          b=target/${{ matrix.target }}/release/bundle
          cp $b/appimage/*.AppImage $b/deb/*.deb $b/rpm/*.rpm \
            $b/dmg/*.dmg $b/nsis/*-setup.exe $b/msi/*.msi out/ 2>/dev/null || true
          # What macOS updates from: the .app, packed as tauri-action did.
          if [ -d $b/macos/irch.app ]; then
            tar -C $b/macos -czf out/irch_${{ matrix.arch }}.app.tar.gz irch.app
          fi
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: out/*
          retention-days: 3

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Room for the build
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: The tag is the version
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "version = \"${TAG#v}\"" Cargo.toml
          v='"version": "'${TAG#v}'"'
          sed -i "s/\"version\": \"[^\"]*\"/$v/" app/tauri.conf.json
      # Google's push, once `app/google-services.json` is committed: the
      # public settings Firebase gives for the app dev.irch.chat.
      - name: Firebase's settings
        run: |
          f=app/google-services.json
          [ -f $f ] || exit 0
          c='.client[] | select(.client_info.android_client_info.package_name == "dev.irch.chat")'
          v() { jq -er "$1" $f; }
          cat > app/gen/android/app/src/main/res/values/firebase.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="google_app_id" translatable="false">$(v "$c.client_info.mobilesdk_app_id")</string>
            <string name="google_api_key" translatable="false">$(v "$c.api_key[0].current_key")</string>
            <string name="project_id" translatable="false">$(v .project_info.project_id)</string>
            <string name="gcm_defaultSenderId" translatable="false">$(v .project_info.project_number)</string>
          </resources>
          EOF
      - working-directory: app
        # Phones only: x86_64 is for emulators, which build their own.
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo tauri android build
          --ci --apk --target aarch64
      - run: mkdir out && cp app/gen/android/app/build/outputs/apk/*/release/*.apk
          out/unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/*
          retention-days: 3

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: The tag is the version
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "version = \"${TAG#v}\"" Cargo.toml
          v='"version": "'${TAG#v}'"'
          sed -i.bak "s/\"version\": \"[^\"]*\"/$v/" app/tauri.conf.json
      - name: The Xcode project, with irch's icons
        working-directory: app
        run: |
          brew install xcodegen
          cargo tauri ios init --ci
          cargo tauri icon icons/icon.png
      - name: An unsigned IPA, which AltStore or SideStore signs
        working-directory: app
        run: cargo tauri ios build --ci --no-sign --target aarch64
      - run: mkdir out && mv app/gen/apple/build/arm64/irch.ipa out/irch.ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: out/*
          retention-days: 3

  # TestFlight, given an App Store Connect key: APPLE_API_KEY (its id),
  # APPLE_API_ISSUER, APPLE_API_KEY_P8 (the .p8's text), APPLE_TEAM_ID.
  testflight:
    needs: ios
    runs-on: macos-latest
    env:
      ASC: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ASC == 'true'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: env.ASC == 'true'
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - if: env.ASC == 'true'
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Signed by Apple, to TestFlight
        if: env.ASC == 'true'
        working-directory: app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          v='"version": "'${TAG#v}'"'
          sed -i.bak "s/\"version\": \"[^\"]*\"/$v/" tauri.conf.json
          brew install xcodegen
          cargo tauri ios init --ci
          cargo tauri icon icons/icon.png
          k=$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8
          mkdir -p "${k%/*}" && echo "$P8" > "$k"
          APPLE_API_KEY_PATH=$k cargo tauri ios build --ci --target aarch64 \
            --export-method app-store-connect
          xcrun altool --upload-app --type ios \
            --file gen/apple/build/arm64/irch.ipa \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          rm -f "$k"

  # The only job with irch's keys and a token that writes. It builds
  # nothing: tauri's signer is installed before the key is in reach.
  # An iPhone build that fails leaves out the IPA, not the release.
  publish:
    needs: [desktop, android, ios]
    if: ${{ !cancelled() && needs.desktop.result == 'success'
      && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: art
          merge-multiple: true
      - name: Android's key on the APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/irch.jks"
          "$tools/zipalign" -f 4 art/unsigned.apk a.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/irch.jks" \
            --ks-pass env:PW --ks-key-alias irch --out art/irch.apk a.apk
          rm -f "$RUNNER_TEMP/irch.jks" art/unsigned.apk a.apk art/*.idsig
      - name: The source (nixos.nix builds it), the installers, the icon
        run: |
          git archive --format=tar.gz -o art/source.tar.gz HEAD
          cp install.sh install.ps1 art/
          cp app/icons/icon.png art/irch.png
      - name: irch's key on every file an update or nixos.nix checks
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd art
          for f in *; do
            case $f in *.dmg | *.ipa | *.sh | *.ps1 | *.png) continue ;; esac
            cargo tauri signer sign --app-version "${TAG#v}" "$f"
          done
      - name: The release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "irch $TAG" --target "$GITHUB_SHA"
          gh release upload "$TAG" art/* --clobber
      - name: latest.json, which the app's updater reads
        shell: python3 {0}
        working-directory: art
        run: |
          import glob, json, os, re, time
          tag, repo = os.environ["TAG"], os.environ["GH_REPO"]
          url = f"https://github.com/{repo}/releases/download/{tag}/"
          cpu = dict(amd64="x86_64", x64="x86_64", x86_64="x86_64",
                     arm64="aarch64", aarch64="aarch64")
          kinds = [(".app.tar.gz", "darwin", None),
                   (".AppImage", "linux", "appimage"),
                   (".deb", "linux", "deb"), (".rpm", "linux", "rpm"),
                   ("-setup.exe", "windows", "nsis"),
                   (".msi", "windows", "msi")]
          out = {}
          for sig in sorted(glob.glob("*.sig")):
              name = sig[:-4]
              # The CLI, source and APK update themselves.
              if re.match(r"irch-(x86_64|aarch64)-|source|irch\.apk", name):
                  continue
              a = cpu[re.search("amd64|x86_64|x64|aarch64|arm64", name)[0]]
              o, kind = next((o, k) for e, o, k in kinds if name.endswith(e))
              entry = dict(signature=open(sig).read(), url=url + name)
              if kind:
                  out[f"{o}-{a}-{kind}"] = entry
              if kind in (None, "appimage", "msi"):
                  out[f"{o}-{a}"] = entry
          json.dump(dict(version=tag.lstrip("v"), platforms=out,
                         pub_date=time.strftime("%Y-%m-%dT%H:%M:%SZ")),
                    open("latest.json", "w"), indent=2)
      - run: gh release upload "$TAG" art/latest.json --clobber
      - run: gh release edit "$TAG" --notes-file .github/release.md
