[package]
name = "irch-app"
description = "irch on the desktop and on Android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "irch_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "irch-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
irch-core.workspace = true
irch-math.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Files shared from this device are chosen by path: never copied.
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

# A push wake with no activity running (android.rs, Push.kt).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
