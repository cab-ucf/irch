[package]
name = "irch-core"
description = "Peer-to-peer, end-to-end encrypted community chat over iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
blake3 = "1"
chacha20poly1305 = "0.11"
data-encoding = "2"
getrandom = "0.4"
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
# Files kept on their sender's device: verified, resumable, any size.
iroh-blobs = { version = "0.103.1", default-features = false, features = ["fs-store"] }
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
# Storage nodes wake phones; already built for iroh, TLS as iroh sets it.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
x-wing = { version = "0.1", features = ["getrandom"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
iroh-mainline-address-lookup = "0.6"

[dev-dependencies]
tracing-subscriber.workspace = true
